name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to validate"
        required: false
        type: string
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
        timeout-minutes: 3
      - run: npm run test:packages
      - run: npm audit --audit-level=high
  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: node scripts/install-test-runtimes.mjs "${{ runner.temp }}/agenvo-runtimes"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build
        id: build
      - run: npm run test:system
        timeout-minutes: 3
      - run: npm run test:adapters
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: docker build -f deploy/vps/Dockerfile -t agenvo:test .
      - run: docker run --rm agenvo:test --help
