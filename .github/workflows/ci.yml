name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to validate"
        required: false
        type: string
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
        timeout-minutes: 3
      - run: npm run test:packages
      - run: npm audit --audit-level=high
  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        replica: [1]
        include:
          - os: windows-latest
            replica: 2
          - os: windows-latest
            replica: 3
          - os: windows-latest
            replica: 4
          - os: windows-latest
            replica: 5
          - os: windows-latest
            replica: 6
          - os: windows-latest
            replica: 7
          - os: windows-latest
            replica: 8
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/install-test-runtimes.mjs "${{ runner.temp }}/agenvo-runtimes"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build
        id: build
      - run: npm run test:adapters
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: Compare delayed unmanaged startup before and after the fix
        if: ${{ matrix.os == 'windows-latest' && matrix.replica == 1 }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync, spawnSync } from 'node:child_process';
          const file = 'tests/adapters/herdr-external.test.ts';
          const fixed = readFileSync(file, 'utf8');
          execFileSync('git', ['fetch', '--depth=1', 'origin', '7e6259d8b68191dcc2b9636d8a58dfcdafb95f4c']);
          const before = execFileSync('git', ['show', '7e6259d:tests/adapters/herdr-external.test.ts'], { encoding: 'utf8' });
          const inject = (source) => source
            .replace('realpath, rm', 'realpath, rm, writeFile')
            .replace('    const args = [\n      codex,', `
              await writeFile(join(root, 'codex.cmd'), [
                '@echo off',
                '"' + process.execPath + '" -e "setTimeout(()=>{},11000)"',
                'call "' + codex + '" %*',
              ].join('\r\n'));
              const args = [
                join(root, 'codex.cmd'),`);
          try {
            for (const [name, source] of [['before', before], ['fixed', fixed]]) {
              writeFileSync(file, inject(source));
              const run = spawnSync(process.execPath, ['scripts/test-system.mjs', '--adapters'], { encoding: 'utf8', timeout: 90000, maxBuffer: 10 * 1024 * 1024 });
              const output = run.stdout + run.stderr;
              console.log(name + ': exit ' + run.status);
              console.log(output.split('\n').filter(line => /ms|deadline|tests |pass |fail |AssertionError/.test(line) && !line.includes('herdrLog')).join('\n'));
              if (name === 'before' ? !(run.status === 1 && output.includes('Initial UI deadline expired') && output.includes('UI appeared after initial deadline')) : run.status !== 0) {
                throw new Error('Unexpected experiment result: ' + name + '\n' + output);
              }
            }
          } finally {
            writeFileSync(file, fixed);
          }
          JS
      - run: npm run test:system
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: docker build -f deploy/vps/Dockerfile -t agenvo:test .
      - run: docker run --rm agenvo:test --help
