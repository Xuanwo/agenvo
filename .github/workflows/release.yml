name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run build
      - name: Pack the release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: npm run release:pack -- "$RUNNER_TEMP/release" "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Publish with npm trusted publishing and verify installed packages
        run: npm run release:publish -- "$RUNNER_TEMP/release"
      - name: Publish GitHub Release and checked tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:github -- "$RUNNER_TEMP/release"
